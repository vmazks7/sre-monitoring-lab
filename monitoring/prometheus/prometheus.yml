global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "appserver_node"
    static_configs:
      - targets: ["10.10.10.11:9100"]

  - job_name: "dbhost_node"
    static_configs:
      - targets: ["10.10.10.12:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["10.10.10.12:9187"]

  - job_name: "appserver_traffic_gen"
    static_configs:
      - targets: ["10.10.10.11:8000"]
